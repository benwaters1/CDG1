{% extends "base.html" %}
{% from "_icons.html" import password_toggle %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <div class="login-crest">Château de Gudanes</div>
    <h1>Set a New Password</h1>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="field-label">New password</label>
      <div class="password-field">
        <input type="password" name="password" id="reset-password" required autofocus>
        {{ password_toggle('reset-password') }}
      </div>
      <label class="field-label">Confirm new password</label>
      <div class="password-field">
        <input type="password" name="confirm_password" id="reset-confirm-password" required>
        {{ password_toggle('reset-confirm-password') }}
      </div>
      <button type="submit" class="btn-primary btn-block">Set password</button>
    </form>
  </div>
</div>
{% endblock %}
