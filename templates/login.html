{% extends "base.html" %}
{% from "_icons.html" import password_toggle %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <div class="login-crest">Château de Gudanes</div>
    <h1>Staff Sign In</h1>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="field-label">Email</label>
      <input type="email" name="email" required autofocus>
      <label class="field-label">Password</label>
      <div class="password-field">
        <input type="password" name="password" id="login-password" required>
        {{ password_toggle('login-password') }}
      </div>
      <button type="submit" class="btn-primary btn-block">Sign in</button>
    </form>
    <p style="text-align:center; margin-top:14px;"><a href="{{ url_for('forgot_password') }}" class="small-link" style="color:var(--steel);">Forgot your password?</a></p>
  </div>
</div>
{% endblock %}
