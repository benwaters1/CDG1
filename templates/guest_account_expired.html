{% extends "public_base.html" %}
{% block title %}Link expired{% endblock %}
{% block content %}

<section class="g-sec g-short"><div class="g-wrap g-wrap--narrow">
<div style="max-width:460px; margin:0 auto;">
  <h1>That link has expired</h1>
  <p class="g-hint">
    Account links last 48 hours, so an old email can't be used to open your bookings later.
    Ask for a fresh one and it'll arrive in a moment.
  </p>
  <a href="{{ url_for('guest_account_request') }}" class="g-btn g-btn--solid" style="display:inline-block;">
    Send me a new link
  </a>
</div>
</div></section>


<img class="g-formhero" src="https://images.squarespace-cdn.com/content/53c3b576e4b02bad423517b8/03ca0108-8c1e-423f-a790-84ed2b154fac/Chateau+de+Gudanes+In+Winter+2.png?format=1500w" alt="The château in snow" loading="lazy">

{% endblock %}
