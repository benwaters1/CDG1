{% extends "public_base.html" %}
{% block title %}Find my registration{% endblock %}
{% block content %}

<div class="login-wrap">
  <div class="login-card">
    <div class="login-crest">Château de Gudanes</div>
    <h1>Find My Registration</h1>
    <form method="post">
      <label class="field-label">Reference code</label>
      <input type="text" name="reference_code" placeholder="WRK-XXXXXX" required>
      <label class="field-label">Email you registered with</label>
      <input type="email" name="email" required>
      <button type="submit" class="btn-primary btn-block">Find registration</button>
    </form>
  </div>
</div>

{% endblock %}
