{% extends "public_base.html" %}
{% block title %}Find my reservation{% endblock %}
{% block content %}

<div class="login-wrap">
  <div class="login-card">
    <div class="login-crest">Château de Gudanes</div>
    <h1>Find My Reservation</h1>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="field-label">Reference code</label>
      <input type="text" name="reference_code" placeholder="DIN-XXXXXX" required>
      <label class="field-label">Email you booked with</label>
      <input type="email" name="email" required>
      <button type="submit" class="btn-primary btn-block">Find reservation</button>
    </form>
  </div>
</div>

{% endblock %}
