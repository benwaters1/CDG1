{% extends "base.html" %}
{% from "_icons.html" import password_toggle %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="narrow-card">
  <h1>Change Password</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="field-label">Current password</label>
    <div class="password-field">
      <input type="password" name="current_password" id="current-password" required>
      {{ password_toggle('current-password') }}
    </div>
    <label class="field-label">New password (min 8 characters)</label>
    <div class="password-field">
      <input type="password" name="new_password" id="new-password" required minlength="8">
      {{ password_toggle('new-password') }}
    </div>
    <label class="field-label">Confirm new password</label>
    <div class="password-field">
      <input type="password" name="confirm_password" id="confirm-password" required minlength="8">
      {{ password_toggle('confirm-password') }}
    </div>
    <button type="submit" class="btn-primary">Update password</button>
  </form>
</div>
{% endblock %}
