<form method="post" action="{{ url_for('new_task') }}" class="search-bar" style="margin-bottom:16px;">
  <div>
    <label class="field-label">Employee</label>
    <select name="assigned_to_user_id" required>
      {% for e in sheet.employees %}
      <option value="{{ e['id'] }}">{{ e['name'] }}</option>
      {% endfor %}
    </select>
  </div>
  <div style="flex:2 1 220px;">
    <label class="field-label">Task</label>
    <input type="text" name="title" placeholder="e.g. Turn over Tour Nord Suite" required>
  </div>
  <div style="flex:2 1 200px;">
    <label class="field-label">Room / guest</label>
    <input type="text" name="room_note" placeholder="e.g. Tour Nord Suite, 2 guests">
  </div>
  <div>
    <label class="field-label">Priority</label>
    <select name="priority">
      <option value="low">Low</option>
      <option value="normal" selected>Normal</option>
      <option value="high">High</option>
    </select>
  </div>
  <div>
    <label class="field-label">Due date</label>
    <input type="date" name="due_date" value="{{ sheet.anchor.isoformat() if sheet is defined else '' }}">
  </div>
  <div style="flex-direction:row; align-items:center; gap:6px; align-self:flex-end; padding-bottom:9px;">
    <input type="checkbox" name="repeat_weekly" id="repeat_weekly" value="1" style="width:auto;">
    <label for="repeat_weekly" class="field-label" style="margin:0;">Repeat weekly</label>
  </div>
  <div style="flex-direction:row; align-items:center; gap:6px; align-self:flex-end; padding-bottom:9px;">
    <input type="checkbox" name="guest_request" id="guest_request" value="1" style="width:auto;">
    <label for="guest_request" class="field-label" style="margin:0;">Guest request</label>
  </div>
  <button type="submit" class="btn-mini">+ Add task</button>
</form>
